<div class="login-wrapper">
  <form class="login-form" [formGroup]="loginForm" (ngSubmit)="onSubmit()">
    <img src="assets/logo.png" alt="Logo" class="logo" />
    <h2>Jewellery Invoice Login</h2>
    <div class="form-row">
      <label>Email</label>
      <input type="email" formControlName="email" placeholder="Enter your email" autocomplete="username" />
      <div class="invalid" *ngIf="loginForm.controls['email'].touched && loginForm.controls['email'].invalid">
        Valid email is required
      </div>
    </div>
    <div class="form-row">
      <label>Password</label>
      <input [type]="hidePassword ? 'password' : 'text'" formControlName="password" placeholder="Password" autocomplete="current-password" />
      <button type="button" class="toggle-password" (click)="hidePassword = !hidePassword" tabindex="-1">
        {{ hidePassword ? 'Show' : 'Hide' }}
      </button>
      <div class="invalid" *ngIf="loginForm.controls['password'].touched && loginForm.controls['password'].invalid">
        Password is required
      </div>
    </div>
    <div class="form-row remember-me">
      <input type="checkbox" formControlName="rememberMe" id="rememberMe" />
      <label for="rememberMe">Remember me</label>
    </div>
    <button type="submit" [disabled]="loading || loginForm.invalid" class="btn-login">
      {{ loading ? 'Logging in...' : 'Login' }}
    </button>
    <div class="error" *ngIf="loginError">{{ loginError }}</div>
  </form>
</div>
