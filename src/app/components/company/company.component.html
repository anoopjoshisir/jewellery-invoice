<app-main-layout>
<form [formGroup]="form" (ngSubmit)="save()" class="invoice-form-grid">
  <div class="form-group">
    <input type="text" formControlName="name" id="name" />
    <label for="name">Company Name</label>
  </div>
  <div class="form-group">
    <input type="text" formControlName="address" id="address" />
    <label for="address">Address</label>
  </div>
  <div class="form-group">
    <input type="text" formControlName="mobile" id="mobile" />
    <label for="mobile">Mobile</label>
  </div>
  <div class="form-group">
    <input type="text" formControlName="gstin" id="gstin" />
    <label for="gstin">GSTIN</label>
  </div>
  <div class="form-group">
    <input type="email" formControlName="email" id="email" />
    <label for="email">Email</label>
  </div>
  <div class="form-group">
    <input type="text" formControlName="logoUrl" id="logoUrl" />
    <label for="logoUrl">Logo URL</label>
  </div>
  <div class="form-group">
    <select formControlName="hideItemFields" multiple>
      <option value="purity">Purity</option>
      <option value="rate">Rate</option>
      <option value="makingCharges">Making Charges</option>
    </select>
    <label>Hide Fields (Entry) in Item</label>
  </div>
  <div class="form-group">
    <select formControlName="hideInvoiceFields" multiple>
      <option value="discountOnGoldWeight">Discount on Gold Weight</option>
    </select>
    <label>Hide Fields (Entry) in Invoice</label>
  </div>
  <div class="form-group">
    <select formControlName="hidePrintItemFields" multiple>
      <option value="purity">Purity</option>
      <option value="rate">Rate</option>
      <option value="makingCharges">Making Charges</option>
    </select>
    <label>Hide Fields (Print) in Item</label>
  </div>
  <div class="form-group">
    <select formControlName="hidePrintInvoiceFields" multiple>
      <option value="discountOnGoldWeight">Discount on Gold Weight</option>
    </select>
    <label>Hide Fields (Print) in Invoice</label>
  </div>
  <button type="submit" [disabled]="!form.valid">Save</button>
  <button type="button" (click)="form.reset();selectedId=null">Clear</button>
</form>

<table>
  <thead>
    <tr>
      <th>Name</th>
      <th>Mobile</th>
      <th>Email</th>
      <th>GSTIN</th>
      <th>Actions</th>
    </tr>
  </thead>
  <tbody>
    <tr *ngFor="let c of companies">
      <td>{{c.name}}</td>
      <td>{{c.mobile}}</td>
      <td>{{c.email}}</td>
      <td>{{c.gstin}}</td>
      <td>
        <button (click)="edit(c)">Edit</button>
        <button (click)="remove(c.id!)">Delete</button>
      </td>
    </tr>
  </tbody>
</table>
</app-main-layout>
