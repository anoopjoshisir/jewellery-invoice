<div class="main-layout-navbar">
  <!-- Tenant Switcher Widget -->
  <app-tenant-switcher></app-tenant-switcher>

  <!-- User Info -->
  <nav class="user-info">
    <span *ngIf="auth.user$ | async as user">
      👤 {{ user.displayName || user.email }}
      <span *ngIf="user.isSuperAdmin" class="super-admin-badge">🛡️ Super Admin</span>
      <span *ngIf="user.isAdmin && !user.isSuperAdmin" class="admin-badge">Admin</span>
    </span>
  </nav>

  <!-- Navigation Links -->
  <div class="nav-links">
    <a routerLink="/dashboard" routerLinkActive="active">Dashboard</a>
    <a routerLink="/customers" routerLinkActive="active">Customers</a>

    <div class="nav-group">
      <span class="nav-label">Estimates</span>
      <a routerLink="/estimates" routerLinkActive="active">Create</a>
      <a routerLink="/estimatelist" routerLinkActive="active">View All</a>
    </div>

    <div class="nav-group">
      <span class="nav-label">Invoices</span>
      <a routerLink="/invoices" routerLinkActive="active">Create</a>
      <a routerLink="/invoicelist" routerLinkActive="active">View All</a>
    </div>

    <a routerLink="/ledger" routerLinkActive="active">Ledger</a>
    <a routerLink="/payment" routerLinkActive="active">Payment</a>
  </div>

  <!-- Super Admin Link -->
  <a
    *ngIf="(auth.user$ | async)?.isSuperAdmin"
    routerLink="/super-admin"
    routerLinkActive="active"
    class="super-admin-link">
    🛡️ Super Admin
  </a>

  <!-- Logout Button -->
  <button class="logout-btn" (click)="logout()">Logout</button>
</div>
<div class="main-layout-content">
  <ng-content></ng-content>
</div>
