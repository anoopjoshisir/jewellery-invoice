<div class="main-layout-navbar">
  <div class="company-select">
    <label>Select Company:</label>
    <select [value]="selectedCompanyId" (change)="onCompanyChange($event.target)">
      <option *ngFor="let c of companies" [value]="c.id">{{c.name}}</option>
    </select>
  </div>
  <nav>
    <span *ngIf="auth.user$ | async as user">
      Welcome, {{ user.displayName || user.email }} <span *ngIf="user.isAdmin">(Admin)</span>
      <!-- company selector can use user.companies -->
    </span>
  </nav>
  <a routerLink="/dashboard">Dashboard</a>
  <a routerLink="/customers">Customers</a>
  <a routerLink="/invoices">Invoices</a>
  <a routerLink="/ledger">Ledger</a>
  <a routerLink="/payment">Payment</a>
  <button (click)="logout()">Logout</button>
</div>
<div class="main-layout-content">
  <ng-content></ng-content>
</div>
