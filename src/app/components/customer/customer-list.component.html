<app-main-layout>
<form [formGroup]="form" (ngSubmit)="save()" class="invoice-form-grid">
  <div class="form-group">
    <input type="text" formControlName="name" id="name" />
    <label for="name">Name</label>
  </div>
  <div class="form-group">
    <input type="text" formControlName="address" id="address" />
    <label for="address">Address</label>
  </div>
  <div class="form-group">
    <input type="text" formControlName="mobile" id="mobile" />
    <label for="mobile">Mobile</label>
  </div>
  <div class="form-group">
    <input type="email" formControlName="email" id="email" />
    <label for="email">Email</label>
  </div>
  <button type="submit" [disabled]="!form.valid">Save</button>
  <button type="button" (click)="form.reset();selectedId=null">Clear</button>
</form>

<table>
  <thead>
    <tr>
      <th>Name</th>
      <th>Mobile</th>
      <th>Email</th>
      <th>Actions</th>
    </tr>
  </thead>
  <tbody>
    <tr *ngFor="let c of customers">
      <td>{{c.name}}</td>
      <td>{{c.mobile}}</td>
      <td>{{c.email}}</td>
      <td>
        <button (click)="edit(c)">Edit</button>
        <button (click)="remove(c.id!)">Delete</button>
      </td>
    </tr>
  </tbody>
</table>
</app-main-layout>
